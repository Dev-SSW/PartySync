spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: partysync
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jackson:
    time-zone: Asia/Seoul
    deserialization:
      accept-float-as-int: false

app:
  auth:
    account-ttl: ${ACCOUNT_SESSION_TTL:P7D}
    member-ttl: ${MEMBER_SESSION_TTL:PT12H}
    rate-limit:
      ip-attempts: ${AUTH_IP_ATTEMPTS:30}
      login-attempts: ${AUTH_LOGIN_ATTEMPTS:10}
      window: ${AUTH_RATE_WINDOW:PT5M}
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
