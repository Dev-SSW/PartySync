spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: partysync
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jackson:
    time-zone: Asia/Seoul

app:
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
